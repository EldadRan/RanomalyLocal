<!doctype html>
<!-- Dev-only: the real UI with Tauri IPC mocked, for checking layout in a browser.
     npm run dev, then open http://localhost:1420/tools/preview.html?state=ready -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <style>html { width: 460px; outline: 1px dashed #555; }</style>
    <title>Ranomaly Local — preview</title>
    <script>
      const state = new URLSearchParams(location.search).get("state") || "ready";
      const title = "Mock job — shot 012 plate ü.mov";
      const dir = "/Volumes/Base_Storage/Downloads/rife_stress/shot 012 plate ü";
      const views = {
        idle: { state: "idle" },
        failed: { state: "failed", message: "the download link has expired — start again from AAB" },
        ready: { state: "ready", op: "video_to_png", source: "delivery.ranomaly.example", title, job_id: "mock_1790504119", details: {
          filename: "shot 012 plate ü.mov", size: 131559347, expires_at: Date.now() / 1000 + 6 * 3600,
          frames: 120, width: 3840, height: 2160, fps: 24, pix_fmt: "yuv422p10le",
          source_high_bit: true, source_alpha: false } },
        unknown_op: { state: "ready", op: "future_op", source: "delivery.ranomaly.example", title, job_id: null, details: {} },
        running: { state: "running", title, stages: ["Download", "Check", "Decode", "Finish"], stage: 2 },
        partial: { state: "partial", title, message: "Cancelled.", facts: [
          { label: "Written", value: "37 frames", mono: true }, { label: "Folder", value: dir, mono: false }] },
        done: { state: "done", title, warning: null, can_open: true, facts: [
          { label: "Frames", value: "120", mono: true }, { label: "Folder", value: dir, mono: false },
          { label: "Video", value: dir + ".mov", mono: false }] },
      };
      const handlers = {};
      let cbId = 0;
      window.__TAURI_INTERNALS__ = {
        transformCallback: (cb) => { const id = ++cbId; window["_" + id] = cb; return id; },
        invoke: async (cmd, args) => {
          console.log("[preview]", cmd, JSON.stringify(args));
          switch (cmd) {
            case "get_view": return views[state];
            case "pick_folder": return "/Volumes/Base_Storage/Downloads/rife_stress";
            case "preflight": return { verdict: "ok", frames_low: 1.2e9, frames_high: 2.9e9, video: 131559347,
              volumes: [{ path: "/", free: 933e9, need_low: 1.3e9, need_high: 3e9 }] };
            case "plugin:event|listen": handlers[args.event] = args.handler; return args.handler;
            default: return null;
          }
        },
      };
      // Layout numbers for headless checks: chrome --dump-dom shows them on <html data-layout>.
      setTimeout(() => {
        const app = document.getElementById("app");
        const wide = [...document.querySelectorAll("#app *")].filter((e) => e.getBoundingClientRect().right > innerWidth + 0.5)
          .map((e) => e.tagName + "." + e.className + "=" + Math.round(e.getBoundingClientRect().right)).slice(0, 8);
        document.documentElement.dataset.layout = JSON.stringify({ vw: innerWidth, vh: innerHeight,
          app: Math.ceil(app.getBoundingClientRect().height), scrollW: document.documentElement.scrollWidth, wide });
      }, 1500);
      // The running preview shows mid-decode progress.
      if (state === "running") setTimeout(() => window["_" + handlers.progress]?.({ payload: { stage: 2, done: 48, total: 120, unit: "frames" } }), 800);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main id="app"></main>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
