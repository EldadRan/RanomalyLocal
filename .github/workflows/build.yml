# Builds and tests Ranomaly Local on Windows and macOS; uploads unsigned installers.
#
# Windows builds only ever happen here: development is on a Mac. Every push to main produces a
# fresh installer under the run's Artifacts (kept 14 days). Signing and the updater come later.
#
# Tagging vX.Y.Z (matching "version" in src-tauri/tauri.conf.json) also publishes the release
# installers to a GitHub Release under fixed names, so these links always serve the newest:
#   https://github.com/EldadRan/RanomalyLocal/releases/latest/download/RanomalyLocal-windows-x64-setup.exe
#   https://github.com/EldadRan/RanomalyLocal/releases/latest/download/RanomalyLocal-macos-arm64.dmg
#
# Artifacts per platform:
#   release  — what users would install; accepts https sources only.
#   debug    — (Windows) also accepts http://127.0.0.1, for testing with tools/mock_r2.py or
#              AAB's mockup server running on the same machine.

name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publishing releases on tags

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis
            release_glob: src-tauri/target/release/bundle/nsis/*-setup.exe
            release_name: RanomalyLocal-windows-x64-setup.exe
          - os: macos-latest
            triple: aarch64-apple-darwin
            bundles: app,dmg
            release_glob: src-tauri/target/release/bundle/dmg/*.dmg
            release_name: RanomalyLocal-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          [[ "${GITHUB_REF_NAME#v}" == "$want" ]] || { echo "tag $GITHUB_REF_NAME but tauri.conf.json says $want"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # aws-lc-sys (TLS for reqwest) assembles with NASM on Windows.
      - if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      # ---- ffmpeg sidecars (LGPL; see docs/ffmpeg.md)

      - name: Cache ffmpeg sidecars
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ffmpeg-${{ matrix.triple }}-${{ hashFiles('scripts/build-ffmpeg-macos.sh', 'scripts/fetch-ffmpeg-windows.sh') }}

      - name: Fetch ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg-windows.sh

      - name: Build ffmpeg (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: scripts/build-ffmpeg-macos.sh arm64

      - name: Check sidecars
        run: |
          ls -la src-tauri/binaries
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          "src-tauri/binaries/ffmpeg-${{ matrix.triple }}$ext" -hide_banner -L | head -3

      # ---- test

      - run: npm ci

      - name: Frontend type-check and build
        run: npm run build

      - name: Rust tests (unit, downloader, real-sidecar decode and colour)
        working-directory: src-tauri
        run: cargo test --locked

      # ---- bundle

      - name: Release bundle
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Debug bundle (Windows, for local mock testing)
        if: runner.os == 'Windows'
        run: npx tauri build --debug --bundles nsis

      - uses: actions/upload-artifact@v4
        with:
          name: ranomaly-local-${{ matrix.triple }}-release
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg

      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ranomaly-local-${{ matrix.triple }}-debug
          retention-days: 14
          if-no-files-found: error
          path: src-tauri/target/debug/bundle/nsis/*.exe

      # ---- release (tags only): fixed names so /releases/latest/download/<name> never changes

      - name: Stage release file
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          files=( ${{ matrix.release_glob }} )
          [[ ${#files[@]} -eq 1 && -f "${files[0]}" ]] || { echo "expected one file, got: ${files[*]}"; exit 1; }
          cp "${files[0]}" "release/${{ matrix.release_name }}"

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/${{ matrix.release_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
